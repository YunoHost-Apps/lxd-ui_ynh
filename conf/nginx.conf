location / {

  # LXD answers the API at the root, the interface lives under /ui/
  rewrite ^/$ /ui/ redirect;

  proxy_pass        https://127.0.0.1:__PORT__;

  # LXD only answers to clients it trusts, this certificate is ours
  proxy_ssl_certificate     __DATA_DIR__/client.crt;
  proxy_ssl_certificate_key __DATA_DIR__/client.key;
  proxy_ssl_protocols TLSv1.2 TLSv1.3;

  proxy_redirect    off;
  proxy_set_header  Host $host;
  proxy_set_header  X-Real-IP $remote_addr;
  proxy_set_header  X-Forwarded-Proto $scheme;
  proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header  X-Forwarded-Host $server_name;
  proxy_set_header  X-Forwarded-Port $server_port;

  # Consoles and event streams
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_buffering off;
  proxy_read_timeout 3600s;

  # Images and ISOs are uploaded through here
  client_max_body_size 0;
  proxy_request_buffering off;

  # Include SSOWAT user panel.
  include conf.d/yunohost_panel.conf.inc;
  more_clear_input_headers 'Accept-Encoding';
}
