test_format = 1.0

[default]

    # The interface uses absolute asset paths, it can only live at the root of a domain
    exclude = ["install.subdir"]

    # busybox-static comes first because lxc-dev recommends it through lxc-templates, and replacing busybox
    # is a removal, which the apt helper forbids.
    preinstall = """
    sudo apt-get install --yes busybox-static
    sudo yunohost app install lxd --force
    """
